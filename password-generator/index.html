<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <!-- Responsividade -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO = Search Engine Optimization -->
    <meta name="keywords" content="gerador de senhas">

    <link rel="stylesheet" href="./assets/style/app-pwd-styles.css">
    <script src="./assets/js/app-pwd-logic.js" defer></script>

    <title>Gerador de Senhas - SENAI-SP</title>
</head>

<body class="app-pwd">

    <header class="app-pwd__header">
        <span class="app-pwd__header--datatime"></span>
        <span class="app-pwd__header--welcome"></span>
    </header>

    <main class="app-pwd__main">

        <img src="./assets/img/logo-senai-sp.png" alt="Logo SENAI SP" class="app-pwd__main--logo">

        <div class="app-pwd__main--input">

            <!-- Tamanho da senha -->
            <span class="app-pwd__main--input-text">Gerador de Senhas: <span class="app-pwd__main--input-size"></span>
                caracteres</span>

            <!-- Slider -->
            <input type="range" class="app-pwd__main--input-slider" min="8" max="16" value="8">

            <!-- Opções para personalização -->
            <div class="app-pwd__main--input-options">

                <label class="app-pwd__main--input-option" name="uppercase-label">
                    <input type="checkbox" class="app-pwd__main--input-option-checkbox uppercase-check" name="uppercase"
                        checked>
                    Letras Maiúsculas (A-Z)
                </label>

                <label class="app-pwd__main--input-option" name="lowercase-label">
                    <input type="checkbox" class="app-pwd__main--input-option-checkbox lowercase-check" name="lowercase"
                        checked>
                    Letras Minúsculas (a-z)
                </label>

                <label class="app-pwd__main--input-option" name="numbers-label">
                    <input type="checkbox" class="app-pwd__main--input-option-checkbox numbers-check" name="numbers"
                        checked>
                    Números (0-9)
                </label>

                <label class="app-pwd__main--input-option" name="special-label">
                    <input type="checkbox" class="app-pwd__main--input-option-checkbox special-check" name="special"
                        checked>
                    Caracteres Especiais (!@#$%&*)
                </label>
            </div>
            <div class="app-pwd__main--input-container-button">
                <button class="app-pwd__main--input-button">Gerar Nova Senha</button>
                <button class="app-pwd__main--input-button app-pwd__main--input-button-clear">Limpar</button>
            </div>
        </div>


        <!-- Exibe a senha gerada e permite a copia -->
        <div class="app-pwd__main--result hide">
            <span class="app-pwd__main--result-title">Sua nova senha foi gerada!</span>
            <span class="app-pwd__main--result-output"></span>
            <span class="app-pwd__main--result-tooltip">Clique na senha para copiar.👆</span>
        </div>

        <!-- Últimas senhas geradas. -->
        <div class="app-pwd__main--history">
            <h2 class="app-pwd__main--history-title">Últimas senhas geradas:</h2>
            <ul class="app-pwd__main--history-list"></ul>
        </div>

    </main>

</body>

</html>
