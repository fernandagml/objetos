<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio</title>
    <link rel="stylesheet" href="./sorteio.css">
    <script src="./sorteio.js" defer></script>
</head>

<body class="sorteador">

    <header class="sorteador__header">
        <h1 class="sorteador__header--title">Sorteador de Números Aleatórios 🎱</h1>
    </header>

    <main class="sorteador__main">

        <section class="sorteador__main--intervalo intervalo">

            <label class="intervalo--label" for="valor-minimo">Valor Mínimo:
                <span class="intervalo__valor intervalo__valor--min"></span>
            </label>
            <input type="range" class="intervalo__slider intervalo__slider--min" name="valor-minimo" min="1" max="100" value="100">

            <label class="intervalo--label" for="valor-maximo">Valor Máximo:
                <span class="intervalo__valor intervalo__valor--max"></span>
            </label>
            <input type="range" class="intervalo__slider intervalo__slider--max" name="valor-maximo" min="1" max="100" value="100">

        </section>

        <section class="sorteador__main--area area">
            <button class="area__button">Sortear</button>
            <span class="area__numero">0</span>
        </section>

        <section class="sorteador__main--historico historico">
            <h2 class="historico__title">Histórico</h2>
            <ul class="historico__lista"></ul>
        </section>

    </main>

    <footer class="sorteador__footer">
        <button class="sorteador__footer--limpar">Limpar Histórico</button>
    </footer>

</body>

</html>
