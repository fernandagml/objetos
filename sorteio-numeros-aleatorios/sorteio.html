<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio</title>
    <link rel="stylesheet" href="./sorteio.css">
    <script src="./sorteio.js" defer></script>
</head>

<body>
    <section class="sorteio">

        <h1>Sorteador de Números Aleatórios 🎱</h1>

        <div class="sorteio__inputs">
            
            <form class="sorteio__form">
                <div class="sorteio__form--inputs">
                    <div class="sorteio__form--input">
                        <label for="min">Valor Mínimo</label>
                        <input type="text" placeholder="Ex: 1" class="sorteio__input--min" name="min">
                    </div>
                    <div class="sorteio__form--input">
                        <label for="max">Valor Máximo</label>
                        <input type="text" placeholder="Ex: 15" class="sorteio__input--max" name="max">
                    </div>
                </div>
                <div class="sorteio__acoes">
                    <input class="sorteio__botao--sortear" type="submit" value="Sortear">
                    <input class="sorteio__botao--reset" type="reset" value="Novo Sorteio">
                </div>
                <div class="sorteio__resultado">
                    <p class="sorteio__resultado--texto"></p>
                </div>
            </form>
        </div>

    </section>
</body>

</html>
